# ROI — 2D lung segmentation with SwinUNETR, sliding-window recipe:
# native-resolution 256x256 patch training + 2D sliding-window inference.
# Same task, same data, same optimizer as configs/roi.yaml (which trains a
# SegResNet). Only the model family changes — a small SwinUNETR (2D,
# feature_size=24 → 6.3 M params, ~ matches the SegResNet's 6.9 M for an
# apples-to-apples architecture comparison in the ROI Jira report).

task: roi

data:
  data_root:   ${DATA_ROOT}           # contains ct_2d/ and roi_sem_seg_2d/
  split_json:  data/splits/unified.json

preprocessing:
  target_size:  [256, 256]           # unused in SW mode (native resolution)
  patch_size:   [256, 256]

model:
  name:         swinunetr
  spatial_dims: 2
  in_channels:  1
  out_channels: 1                     # sigmoid
  img_size:     [256, 256]
  feature_size: 24                    # small variant: 6.3 M params (default is 48 → 25 M)
  depths:       [2, 2, 2, 2]
  num_heads:    [3, 6, 12, 24]
  dropout_prob: 0.0
  use_checkpoint: false

training:
  mode:              sliding_window
  patches_per_volume: 4
  pos_neg_ratio:     1.0
  epochs:            100
  batch_size:        4                # x4 patches = 16 patches/step
  samples_per_epoch: 20000            # matches roi.yaml exactly
  lr:                1.0e-4           # transformers usually want a smaller LR than CNNs
  weight_decay:      1.0e-5
  val_interval:      1
  device:            cuda
  amp:               true
  amp_dtype:         bfloat16
  seed:              42

scheduler:
  T_max:   100
  eta_min: 1.0e-6

checkpoints:
  dir:        checkpoints/roi_swin_sw
  save_every: 10

logging:
  dir:        runs/roi_swin_sw

inference:
  sw_overlap: 0.5
  sw_batch:   8
