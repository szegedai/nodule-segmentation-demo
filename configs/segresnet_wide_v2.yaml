# Stage 2 Fine — SegResNet (WIDE, init_filters=32) on unified_v2 split.
#
# The paper's best two-stage nodule model on the v2 benchmark.
# Same architecture family as the `unified` split's wide SegResNet
# (`segresnet_wide_v1.yaml`) but retrained on the balanced v2 split.
#
# Reproduces the checkpoint originally saved as `checkpoints_v11` on the
# training cluster; peaked at val Dice 0.5711 (epoch 489 of 1000).
# Hosted on HuggingFace as `szabopeter/nodule-segresnet-3d-wide-v2`.

task: nodule

# Note: v11 was trained with `bboxes_unified_v2.json` (regenerated,
# tighter lung crops) — different from the `processed/bboxes_unified.json`
# bundled here for v6/v9. If you want byte-for-byte reproduction of
# v11, use the v2 bboxes; otherwise the small bbox differences will
# not materially affect training.

data:
  datasets:
    - name: unified
      ct_dir:  ${DATA_ROOT}/ct_3d
      seg_dir: ${DATA_ROOT}/nodule_sem_seg_3d
  bbox_json:   processed/bboxes_unified.json
  split_json:  data/splits/unified_v2.json
  num_workers: 8

preprocessing:
  target_size:  [256, 256, 256]
  bbox_padding: 20

model:
  name:         segresnet
  spatial_dims: 3
  in_channels:  1
  out_channels: 2
  init_filters: 32                # WIDE — 4× v6's 16
  blocks_down:  [1, 2, 2, 4, 4]
  blocks_up:    [1, 1, 1, 1]
  dropout_prob: 0.1

training:
  epochs:       1000
  batch_size:   2
  lr:           1.0e-5
  weight_decay: 1.0e-5
  val_interval: 5
  device:       cuda
  amp:          true
  amp_dtype:    bfloat16
  seed:         42

loss:
  alpha:      0.3
  beta:       0.7
  gamma:      2.0
  prob_clamp: 1.0e-4
  lambda_ce:        0.3           # note: v11 used 0.3 (higher than v7's 0.1)
  ce_bg_weight:     1.0
  ce_nodule_weight: 100.0

scheduler:
  T_max:   1000
  eta_min: 1.0e-6

checkpoints:
  dir:        checkpoints/segresnet_wide_v2
  save_every: 50

logging:
  dir:          runs/segresnet_wide_v2
  vis_interval: 10
  vis_cases:    3
  log_every:    0
