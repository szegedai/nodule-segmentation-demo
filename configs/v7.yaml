task: nodule

# v7 — Wider SegResNet (init_filters=32, ~83 M params). Paper's best model.
# Same architecture family as v6, 4× the capacity, batch dropped to 2 for VRAM.
# Reported test val_dice: 0.589  (sens 0.774, prec 0.693).

data:
  datasets:
    - name: unified
      ct_dir:  ${DATA_ROOT}/ct_3d
      seg_dir: ${DATA_ROOT}/nodule_sem_seg_3d
  bbox_json:   processed/bboxes_unified.json
  split_json:  data/splits/unified.json
  num_workers: 8

preprocessing:
  target_size:  [256, 256, 256]
  bbox_padding: 20

model:
  name:         segresnet
  spatial_dims: 3
  in_channels:  1
  out_channels: 2
  init_filters: 32
  blocks_down:  [1, 2, 2, 4, 4]
  blocks_up:    [1, 1, 1, 1]
  dropout_prob: 0.1

training:
  epochs:       1000
  batch_size:   2
  lr:           1.0e-5
  weight_decay: 1.0e-5
  val_interval: 5
  device:       cuda
  amp:          true
  amp_dtype:    bfloat16
  seed:         42

loss:
  alpha:      0.3
  beta:       0.7
  gamma:      2.0
  prob_clamp: 1.0e-4
  lambda_ce:        0.1
  ce_bg_weight:     1.0
  ce_nodule_weight: 100.0

scheduler:
  T_max:   1000
  eta_min: 1.0e-6

checkpoints:
  dir:        checkpoints/v7
  save_every: 50

logging:
  dir:        runs/v7
