task: nodule

# v9 — DynUNet (nnU-Net-style self-configuring U-Net, ~31 M params).
# 6-level U-Net (4³ bottleneck from 256³ via 5× stride-2 downsamples).
# Highest precision of all four models (0.746).
# Reported test val_dice: 0.562  (sens 0.679, prec 0.746).

data:
  datasets:
    - name: unified
      ct_dir:  ${DATA_ROOT}/ct_3d
      seg_dir: ${DATA_ROOT}/nodule_sem_seg_3d
  bbox_json:   processed/bboxes_unified.json
  split_json:  data/splits/unified_v2.json
  num_workers: 8

preprocessing:
  target_size:  [256, 256, 256]
  bbox_padding: 20

model:
  name:         dynunet
  spatial_dims: 3
  in_channels:  1
  out_channels: 2
  strides: [[1, 1, 1], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
  kernel_size: [[3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
  upsample_kernel_size: [[2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2], [2, 2, 2]]
  norm_name: instance
  deep_supervision: false
  dropout_prob: 0.0

training:
  epochs:       400
  batch_size:   2
  lr:           1.0e-5
  weight_decay: 1.0e-5
  val_interval: 5
  device:       cuda
  amp:          true
  amp_dtype:    bfloat16
  seed:         42

loss:
  alpha:      0.3
  beta:       0.7
  gamma:      2.0
  prob_clamp: 1.0e-4
  lambda_ce:        0.1
  ce_bg_weight:     1.0
  ce_nodule_weight: 100.0

scheduler:
  T_max:   400
  eta_min: 1.0e-6

checkpoints:
  dir:        checkpoints/dynunet_v2
  save_every: 50

logging:
  dir:        runs/dynunet_v2
