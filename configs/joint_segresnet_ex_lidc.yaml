# Stage 3 Joint — SegResNet (small, v6 clone) on NLST + NSCLC only.
#
# 3-class softmax head: 0=background  1=lung  2=nodule
# Full CT resampled to 256³ (no bbox crop) — end-to-end joint model.
# LIDC-IDRI is excluded from this variant (no GT lung labels available).
#
# Reproduces the checkpoint hosted at:
#   https://huggingface.co/szabopeter/joint-segresnet-3d-ex-lidc

task: joint

data:
  datasets:
    - name: unified
      ct_dir:     ${DATA_ROOT}/ct_3d
      lung_dir:   ${DATA_ROOT}/lung_sem_seg_3d
      nodule_dir: ${DATA_ROOT}/nodule_sem_seg_3d
  split_json:  data/splits/unified_ex_lidc.json
  num_workers: 8

preprocessing:
  target_size:  [256, 256, 256]

model:
  name:         segresnet
  spatial_dims: 3
  in_channels:  1
  out_channels: 3               # bg / lung / nodule
  init_filters: 16
  blocks_down:  [1, 2, 2, 4, 4]
  blocks_up:    [1, 1, 1, 1]
  dropout_prob: 0.1

training:
  epochs:       400
  batch_size:   4
  lr:           1.0e-5
  weight_decay: 1.0e-5
  val_interval: 5
  device:       cuda
  amp:          true
  amp_dtype:    bfloat16
  seed:         42

loss:
  alpha:      0.3
  beta:       0.7
  gamma:      2.0
  prob_clamp: 1.0e-4
  lambda_ce:  0.1
  class_weights: [1.0, 1.0, 100.0]   # bg, lung, nodule

scheduler:
  T_max:   400
  eta_min: 1.0e-6

checkpoints:
  dir:        checkpoints/joint_segresnet_ex_lidc
  save_every: 50

logging:
  dir:        runs/joint_segresnet_ex_lidc
